schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: fhdl — ранний генератор Verilog из Forth-DSL (предшественник fhdlgen), часть экосистемы VitaSound feco.
  Правила агента: AGENTS.md. Стек: Gforth, правила frules, package.4th. Примеры: project*.4th → project*.v.
  Новую функциональность генерации по умолчанию развивать в fhdlgen; здесь — исправления и эксперименты.
  Проверка: fmix test, flint, fcov run && fcov report; из Cursor — MCP vitasound-forth.

rules:
  specs:
    - Scenario формулировать через входной project*.4th и ожидаемый .v
  tasks:
    - Новое поведение покрывать тестом в tests/*_test.4th
